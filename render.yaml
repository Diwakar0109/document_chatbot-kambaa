services:
  - type: web
    name: document-chatbot-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GROQ_API_KEY
        syncValue: false # set in the Render dashboard — never commit the real key
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: EMBEDDINGS_PROVIDER
        value: fastembed

  - type: web
    name: document-chatbot-frontend
    runtime: static
    rootDir: frontend
    buildCommand: echo "static site — no build step"
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
